name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - release/*
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  generic:
    runs-on: ubuntu-latest
    steps:
      - uses: black-desk/workflows/generic@master
        env:
          CLEAN_IGNORE: "*.in"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: black-desk/workflows/format@master

  rust:
    permissions:
      id-token: write
      contents: write

    # Fail hard if the djot.js conformance suite can't actually run (missing JS
    # toolchain, missing submodule, failed build) instead of silently skipping.
    # Guards against a future runner-image change that drops node/npm unnoticed.
    env:
      DJOTLS_REQUIRE_CONFORMANCE: "1"

    runs-on: ubuntu-latest
    steps:
      - uses: black-desk/workflows/rust@master

  pass:
    name: pass
    if: always()
    needs:
      - generic
      - format
      - rust
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  # crates.io's Trusted Publisher must name ci.yml: this caller's workflow_ref
  # is the OIDC identity even though the publishing job lives in cd.yml. Both
  # caller and publishing job need id-token: write for token exchange.
  # Configure it for black-desk/djotls with workflow ci.yml and no environment.
  # Publishing uses OIDC; no long-lived crates.io token is needed.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: pass
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/cd.yml
